<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="./img/logo.fav.png" type="image/png">
<title>Painel — Elizabeth's Doceria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{background:var(--lavender-bg);}
  .admin-page{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;}
  .admin-topbar{max-width:640px;width:100%;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;}
  .admin-topbar h1{font-size:20px;color:var(--plum);}
  .admin-topbar a{font-size:12.5px;color:var(--text-soft);border-bottom:1px solid transparent;}
  .admin-topbar a:hover{border-color:var(--gold);color:var(--plum);}
  .admin-wrap{max-width:640px;width:100%;}
  .pw-toggle{font-size:12px;color:var(--text-soft);text-align:right;margin-top:-6px;margin-bottom:14px;}
  .pw-toggle a{color:var(--rose);font-weight:500;}
  .pw-box{background:#fbf6fc;border:1px solid #eadcf2;border-radius:12px;padding:16px;margin-bottom:18px;}
  .pw-box h3{font-size:14px;color:var(--plum);margin-bottom:10px;}
</style>
</head>
<body>

<div class="admin-page">
  <div class="admin-wrap" id="root"></div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="admin.js"></script>
</body>
</html>
